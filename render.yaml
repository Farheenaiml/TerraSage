services:
  # FastAPI Backend Web Service
  - type: web
    name: terrasage-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: terrasage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false

  # React + Vite Frontend Static Site (Globally Distributed CDN)
  - type: web
    name: terrasage-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: terrasage-backend
          property: host

# Cloud PostgreSQL Database
databases:
  - name: terrasage-db
    region: oregon
    plan: free
    databaseName: terrasage
    user: terrasage_user
