version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: terrasage_db
    environment:
      POSTGRES_DB: terrasage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrasage_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/terrasage
      - SECRET_KEY=production-secret-terrasage-key
      - ENVIRONMENT=production
      - LLM_PROVIDER=groq
      - LLM_MODEL=openai/gpt-oss-20b
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: terrasage_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
